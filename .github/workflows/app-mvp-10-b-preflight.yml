name: APP MVP-10-B no-cost preflight

on:
  push:
    branches:
      - feature/app-mvp-10-b-pilot-preflight
  pull_request:
    branches:
      - feature/app-mvp-10-a-offline-dry-run
    paths:
      - 'prototype/app-mvp-10b/**'
      - 'prototype/app-mvp-10/**'
      - 'app/preview-fixtures/**'
      - '.github/workflows/app-mvp-10-b-preflight.yml'

permissions:
  contents: read

jobs:
  offline-preflight:
    name: Verify budget-gated synthetic-only NO_GO state
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --check prototype/app-mvp-10b/pilot-preflight.mjs
          node --check prototype/app-mvp-10b/run-preflight.mjs
          node --test prototype/app-mvp-10b/pilot-preflight.test.mjs
      - name: Generate non-billable release-readiness report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-reports/app-mvp-10b
          node prototype/app-mvp-10b/run-preflight.mjs > .qa-reports/app-mvp-10b/no-go-sc01.json
          python3 -m json.tool .qa-reports/app-mvp-10b/no-go-sc01.json >/dev/null
          grep -F '"status": "NO_GO"' .qa-reports/app-mvp-10b/no-go-sc01.json
          grep -F '"eligible_for_paid_execution": false' .qa-reports/app-mvp-10b/no-go-sc01.json
          grep -F '"charged_calls": 0' .qa-reports/app-mvp-10b/no-go-sc01.json
      - name: Publish sanitized readiness report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mvp-10b-no-go-${{ github.run_id }}
          path: .qa-reports/app-mvp-10b/
          if-no-files-found: warn
          retention-days: 14
