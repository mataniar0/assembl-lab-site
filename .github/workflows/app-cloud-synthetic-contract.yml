name: App cloud synthetic contract

on:
  pull_request:
    branches: [main, feature/app-mvp-04-06-private-backend]
    paths:
      - 'supabase/**'
      - '.github/workflows/app-cloud-synthetic-contract.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/app-cloud-synthetic-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Synthetic cloud contract (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and synthetic contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check supabase/functions/app-mock-api/synthetic-logic.mjs
          node --check --input-type=module < supabase/functions/app-mock-api/index.ts
          node --test supabase/functions/app-mock-api/synthetic-logic.test.mjs
      - name: Explicitly state validation boundary
        run: echo "This workflow does not start Supabase, apply SQL migrations, deploy APIs or test real RLS behavior."
