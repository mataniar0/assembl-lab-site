name: APP MVP-20 3D source inspect and model-to-hero build
on:
  push:
    branches:
      - feature/app-mvp-20-coffee-glb-hero-parity
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065d # v5
        with:
          python-version: '3.12'
      - name: Inspect original digital table GLB
        run: python scripts/personal_table_visual.py
