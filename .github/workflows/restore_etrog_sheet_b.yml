name: Restore Etrog Box Production Sheet B
on:
  push:
    paths:
      - 'etrog_box/v6_2/staging/21_production_sheet_B_corners_900x600.dxf.xz.b64'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify DXF
        shell: bash
        run: |
          mkdir -p etrog_box/v6_2/production_sheets
          base64 -d etrog_box/v6_2/staging/21_production_sheet_B_corners_900x600.dxf.xz.b64 | xz -d > etrog_box/v6_2/production_sheets/21_production_sheet_B_corners_900x600.dxf
          echo "a00f5ede3e2a86613fe561efe3436a8ca9dd888beb2fbca0ddafa0aa51732f31  etrog_box/v6_2/production_sheets/21_production_sheet_B_corners_900x600.dxf" | sha256sum -c -
      - name: Commit reconstructed DXF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etrog_box/v6_2/production_sheets/21_production_sheet_B_corners_900x600.dxf
          git diff --cached --quiet || git commit -m "Restore Etrog Box V6.2 production sheet B"
          git push
